name: E12/D6 Bedrock → GitHub Release (research PoC)

# D6: Bedrock-Claude generates release notes; softprops/action-gh-release publishes public release.
# Canary content only. workflow_dispatch trigger only.

on:
  workflow_dispatch:
    inputs:
      canary_uuid:
        description: 'Canary UUID for the release'
        required: true
        type: string

permissions:
  contents: write  # required for creating releases

jobs:
  d6-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> "$GITHUB_ENV"
          aws sts get-caller-identity --query 'Arn' --output text | awk -F'/' '{print "Identity: "$NF}'

      - name: Invoke Bedrock for release notes
        env:
          AWS_REGION: us-east-1
          CANARY: ${{ inputs.canary_uuid }}
        run: |
          set -euo pipefail
          MODEL_ID="global.anthropic.claude-sonnet-4-5-20250929-v1:0"
          PROMPT=$(jq -nc --arg canary "$CANARY" '{
            anthropic_version: "bedrock-2023-05-31",
            max_tokens: 1200,
            system: "You write GitHub release notes in markdown. Include the given canary UUID verbatim inside a code block. Add 3-4 fake-but-plausible bullet points about a hypothetical minor version bump. Do NOT include any real product data. Output only the markdown, no wrapping.",
            messages: [{role: "user", content: [{type: "text", text: "Canary: CANARY-E12-D6-\($canary). Write release notes for v0.0.\($canary | .[0:6])."}]}]
          }')
          echo "$PROMPT" > /tmp/prompt.json
          echo "bedrock_start=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
          aws bedrock-runtime invoke-model \
            --model-id "$MODEL_ID" \
            --content-type application/json \
            --accept application/json \
            --body fileb:///tmp/prompt.json \
            /tmp/bedrock-response.json
          echo "bedrock_end=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
          jq -r '.content[0].text' /tmp/bedrock-response.json > /tmp/release-notes.md
          echo "--- Release notes preview ---"
          cat /tmp/release-notes.md
          echo "----------------------------"
          echo "Canary present: $(grep -c "$CANARY" /tmp/release-notes.md)"

      - name: Publish GitHub Release with Bedrock-generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: e12-d6-${{ inputs.canary_uuid }}
          name: E12/D6 Bedrock-Claude generated release (${{ inputs.canary_uuid }})
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: true  # tag as prerelease so it doesn't show as "latest"
          make_latest: 'false'

      - name: Summary
        env:
          CANARY: ${{ inputs.canary_uuid }}
        run: |
          {
            echo "# E12/D6 — completed"
            echo "- Canary: CANARY-E12-D6-${CANARY}"
            echo "- Bedrock: ${bedrock_start} → ${bedrock_end}"
            echo "- Release tag: e12-d6-${CANARY}"
            echo "- Release URL: https://github.com/${{ github.repository }}/releases/tag/e12-d6-${CANARY}"
          } >> "$GITHUB_STEP_SUMMARY"
